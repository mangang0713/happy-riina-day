services:
  postgres:
    image: postgres:17-alpine
    container_name: happy-riina-day-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: happy_riina_day
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - community-postgres-data:/var/lib/postgresql/data
      - ./community-api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d happy_riina_day"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  community-postgres-data:
